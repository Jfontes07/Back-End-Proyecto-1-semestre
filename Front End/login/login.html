<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iniciar sesión · Esencia Uruguaya</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>

    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>

    <div class="rv-title-center">
      <a href="../index.html" class="rv-home-link">
        <img src="../Fotos/esenciauruguaya-animado.gif" alt="Esencia Uruguaya" class="rv-logo-img">
        <div class="rv-subtitle">edición digital · montevideo</div>
      </a>
    </div>

    <main class="caja-login">
      <h1>Iniciar sesión</h1>
      <form id="formLogin">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" name="usuario" placeholder="admin" autocomplete="username" />

        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••" autocomplete="current-password" />

        <button type="submit">Entrar</button>
      </form>

      <p id="mensaje" class="mensaje"></p>
      <a href="../index.html" class="pista">← Volver a la carátula</a>
    </main>

    <script src="login.js"></script>
  </body>
</html>
