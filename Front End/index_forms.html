<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="style.css" />

    <title>Esencia Uruguaya</title>
  </head>

  <body>
    <header class="header-sitio">
      <div class="header-sitio__logo">
        <a href="/">Esencia Uruguaya</a>
      </div>
      <nav class="header-sitio__nav">
        <ul>
          <li><a href="/">Inicio</a></li>
          <li><a href="/articulos">Artículos</a></li>
          <li><a href="/sobre-nosotros">Sobre nosotros</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <header class="header-pagina">
        <h2>Cargá tu artículo</h2>
        <p class="subtitulo-pagina">Redacción · Esencia Uruguaya</p>
      </header>

      <form
        action="http://localhost:3000/articulos"
        method="POST"
        enctype="multipart/form-data"
      >
        <!-- DATOS PRINCIPALES -->
        <fieldset>
          <legend>Datos del artículo</legend>

          <div class="campo">
            <label for="tituloPrincipal">Título</label>
            <input
              type="text"
              id="tituloPrincipal"
              name="titulo"
              placeholder="El asado"
              minlength="3"
              maxlength="40"
              required
            />
          </div>

          <div class="campo">
            <label for="subtitulo">Subtítulo</label>
            <input
              type="text"
              id="subtitulo"
              name="subtitulo"
              placeholder="El maravilloso mundo de la carne"
              minlength="3"
              maxlength="80"
            />
          </div>

          <div class="campo">
            <label for="fecha">Fecha de creación</label>
            <input type="date" id="fecha" name="fecha" />
          </div>
        </fieldset>

        <hr class="divider" />

        <!-- AUTOR -->
        <fieldset>
          <legend>Autor</legend>
          <div class="campo">
            <label for="autor">Nombre del creador</label>
            <input type="text" id="autor" name="autor" placeholder="Anabel" />
          </div>
        </fieldset>

        <hr class="divider" />

        <!-- CONTENIDO -->
        <fieldset>
          <legend>Contenido del artículo</legend>

          <div class="campo">
            <label for="contenido">Cuerpo del artículo</label>
            <textarea
              id="contenido"
              name="contenido"
              placeholder="Escribí el contenido del artículo acá..."
            ></textarea>
          </div>

          <div class="campo">
            <label for="descripcion">Descripción breve</label>
            <textarea
              id="descripcion"
              name="descripcion"
              placeholder="Un resumen corto del artículo..."
            ></textarea>
          </div>
        </fieldset>

        <hr class="divider" />

        <!-- IMAGEN -->
        <fieldset>
          <legend>Imagen</legend>
          <div class="campo">
            <label for="imagen">Imagen del artículo</label>
            <input
              type="file"
              id="imagen"
              name="imagen"
              multiple
              accept="image/*"
            />
          </div>
        </fieldset>

        <hr class="divider" />

        <!-- TÉRMINOS Y ENVÍO -->
        <div class="terminos">
          <input type="checkbox" id="tos" name="tos" required />
          <label for="tos">Acepto los términos y condiciones</label>
        </div>

        <button type="submit">Publicar artículo</button>
      </form>
    </main>
  </body>
</html>
