<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Artículo</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; background:#f2f2f2; min-height:100vh; padding:30px;">

    <header style="display:flex; justify-content:center; margin-bottom:40px;">
        <form>
            <input
                type="text"
                placeholder="Publicación de Artículo"
                style="
                    width:400px;
                    height:50px;
                    border:3px solid #555;
                    border-radius:8px;
                    text-align:center;
                    font-size:24px;
                    font-weight:bold;
                "
            >
        </form>
    </header>

    <main
        style="
            max-width:900px;
            margin:auto;
            background:white;
            border:2px solid #444;
            border-radius:20px;
            padding:40px;
        "
    >

        <form
            style="
                display:flex;
                flex-direction:column;
                gap:18px;
            "
        >

            <input
                type="text"
                placeholder="Título"
                style="
                    width:100%;
                    padding:12px;
                    border:2px solid #666;
                    border-radius:10px;
                    font-size:1rem;
                "
            >

            <input
                type="text"
                placeholder="Subtítulo"
                style="
                    width:100%;
                    padding:12px;
                    border:2px solid #666;
                    border-radius:10px;
                    font-size:1rem;
                "
            >

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:15px;
                "
            >
                <label
                    style="
                        min-width:90px;
                        border:2px solid #666;
                        border-radius:10px;
                        padding:10px;
                        text-align:center;
                    "
                >
                    Fecha
                </label>

                <input
                    type="date"
                    style="
                        width:100%;
                        padding:12px;
                        border:2px solid #666;
                        border-radius:10px;
                    "
                >
            </div>

            <div
                style="
                    display:flex;
                    align-items:center;
                    gap:15px;
                "
            >
                <label
                    style="
                        min-width:90px;
                        border:2px solid #666;
                        border-radius:10px;
                        padding:10px;
                        text-align:center;
                    "
                >
                    Creador
                </label>

                <input
                    type="text"
                    placeholder="Quién crea"
                    style="
                        width:100%;
                        padding:12px;
                        border:2px solid #666;
                        border-radius:10px;
                    "
                >
            </div>

            <textarea
                placeholder="Contenido del artículo"
                style="
                    min-height:250px;
                    padding:20px;
                    border:2px solid #666;
                    border-radius:15px;
                    resize:vertical;
                    font-size:1rem;
                "
            ></textarea>

            <div
                style="
                    display:flex;
                    flex-direction:column;
                    gap:8px;
                "
            >
                <label style="font-weight:bold;">
                    Imágenes del artículo
                </label>

                <input
                    type="file"
                    accept="image/*"
                    multiple
                    style="
                        padding:12px;
                        border:2px solid #666;
                        border-radius:10px;
                        background:white;
                    "
                >
            </div>

            <input
                type="url"
                placeholder="Bibliografía o Fuente"
                style="
                    width:100%;
                    padding:12px;
                    border:2px solid #666;
                    border-radius:10px;
                    font-size:1rem;
                "
            >

            <button
                type="submit"
                style="
                    padding:15px;
                    border:none;
                    background:#7dcf7d;
                    color:white;
                    font-size:1rem;
                    font-weight:bold;
                    border-radius:10px;
                    cursor:pointer;
                "
            >
                Publicar Artículo
            </button>

        </form>

    </main>

</body>
</html>
