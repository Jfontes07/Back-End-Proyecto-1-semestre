<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="estilos/style_articulo.css" />
    <link rel="stylesheet" href="estilos/style_caratula.css" />
  </head>

  <body>
    <div id="inicio"></div>

<div class="rv-title-center">
<img src="Fotos/esenciauruguaya-animado.gif" alt="Esencia Uruguaya" class="rv-logo-img" />
  <div class="rv-subtitle">edición digital · montevideo</div>
</div>

<header class="rv-header">
  <nav class="rv-nav">
    <div class="rv-nav-item">
      <span class="rv-nav-label">Fecha</span>
      <span class="rv-date" id="rv-fecha"></span>
    </div>
    <div class="rv-nav-item">
      <span class="rv-nav-label">Visitas</span>
      <div class="rv-visitas">
        👀
        <img src="https://visitor-badge.laobi.icu/badge?page_id=escencia-uruguaya&left_color=7bafd4&right_color=4a90d9&left_text=visitas" class="rv-badge" />
      </div>
    </div>
    <div class="rv-nav-item">
      <span class="rv-nav-label">Música</span>
      <audio autoplay loop controls class="rv-audio">
        <source src="musica/rada.mp3" type="audio/mpeg" />
      </audio>
    </div>
    <div class="rv-nav-item">
      <span class="rv-nav-label">Clima</span>
      <div class="rv-clima">
        <span class="rv-temp" id="rv-temp">--°C</span>
        <span class="rv-loc">📍 Montevideo</span>
        <span class="rv-cond" id="rv-cond"></span>
      </div>
    </div>
    <div class="rv-nav-item rv-nav-redaccion">
      <span class="rv-nav-label">Redacción</span>
      <a href="form/index.html" class="btn-crear">Nuevo artículo</a>
    </div>
  </nav>
  <div class="rv-line"></div>
</header>
    <div class="bg"></div>
    <div class="bg bg2"></div>
    <div class="bg bg3"></div>
    <div class="contenedor">
      </header>

      <main>
        <header class="header-articulo">
          <div>
            <h1 id="tituloPrincipal">Cargando...</h1>
          </div>

          <div>
            <h3 id="subtitulo"></h3>
          </div>
        </header>

        <img id="Imagen1" src="" alt="Imagen del artículo" />

        <div>
          <p id="contenido">Cargando contenido...</p>
        </div>

        <img id="Imagen2" src="" alt="Imagen del artículo" />

        <h5 id="autor">Creador</h5>

        <footer class="footer">
          © 2026 Esencia Uruguaya | Todos los derechos reservados |
          <a href="index_caratula.html">Volver a la portada</a>
        </footer>
      </main>
    </div>

    <script src="indexarticulo.js"></script>
    <script src="/BackEnd/api-clima/app.js"></script>
<script>
  const fecha = new Date();
  document.getElementById('rv-fecha').textContent =
    fecha.toLocaleDateString('es-UY', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
</script>
<script>
  const titleCenter = document.querySelector('.rv-title-center');
  const header = document.querySelector('.rv-header');

  let ticking = false;
  const umbralOn = 80;
  const umbralOff = 40;

  window.addEventListener('scroll', () => {
    if (!ticking) {
      requestAnimationFrame(() => {
        const y = window.scrollY;
        if (y > umbralOn) {
          titleCenter.classList.add('scrolled');
          header.classList.add('scrolled');
        } else if (y < umbralOff) {
          titleCenter.classList.remove('scrolled');
          header.classList.remove('scrolled');
        }
        ticking = false;
      });
      ticking = true;
    }
  });
</script>
  </body>
</html>
