<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>
    <link rel="stylesheet" href="Estilos/style_contacto.css">
</head>
<body>

    <div class="contenedor">
        <h1>Contacto</h1>

        <p>Si tienes alguna consulta o sugerencia sobre nuestra revista, puedes comunicarte con nosotros mediante el siguiente formulario.</p>

        <form>
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" placeholder="Ingresa tu nombre">

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="Ingresa tu correo">

            <label for="mensaje">Mensaje</label>
            <textarea id="mensaje" rows="6" placeholder="Escribe tu mensaje"></textarea>

            <button type="submit">Enviar</button>
        </form>

        <br>

        <a href="index_caratula.html" class="inicio">Volver al inicio</a>
    </div>

    <br>

    <footer class="footer">
        © 2026 Esencia Uruguaya | Todos los derechos reservados
      </footer>

</body>
</html>
